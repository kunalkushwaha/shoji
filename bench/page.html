<!doctype html><html><head><meta charset="utf-8"><title>Benchmark page</title>
<style>body{font:15px -apple-system;margin:30px;background:#f6f8fa}.card{background:#fff;border:1px solid #d0d7de;border-radius:12px;padding:16px;margin:12px 0}
.spin{width:80px;height:80px;border-radius:14px;background:#1f6feb;animation:s 2s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head>
<body><h1>Benchmark page</h1><div class="spin"></div><p>Frames: <b id="n">0</b></p>
<div id="cards"></div>
<script>
for (let i = 0; i < 40; i++) { const d = document.createElement("div"); d.className = "card"; d.innerHTML = "<b>Card " + i + "</b><p>Generated by JavaScript, with an inline chart.</p><svg width='300' height='40'><rect width='" + (60 + i * 5) + "' height='40' rx='6' fill='#8250df'/></svg>"; cards.appendChild(d); }
let n = 0; (function f() { document.getElementById("n").textContent = ++n; requestAnimationFrame(f); })();
</script></body></html>
